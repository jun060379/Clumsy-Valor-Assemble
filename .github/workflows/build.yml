name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write      # the "latest-build" release (one-click download of the newest Windows build)
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  GODOT: 4.4.1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT}-stable_linux.x86_64.zip && mv Godot_v${GODOT}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q Godot_v${GODOT}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT}.stable/
      - name: Export
        run: |
          echo "$(date -u -d '+9 hours' +%m-%d\ %H:%M) · ${GITHUB_SHA::7}" > build.txt
          mkdir -p build/web build/windows
          touch build/.gdignore    # Godot must not import its own exports (also committed)
          ./godot --headless --import || true
          ./godot --headless --export-release "Web" build/web/index.html
          # cache-bust the game data: Pages caches files ~10 min, so a phone kept loading the old index.pck
          sed -i "s#GODOT_CONFIG = {#GODOT_CONFIG = {\"mainPack\":\"index.pck?v=${GITHUB_SHA::7}\",#" build/web/index.html
          grep -q "index.pck?v=" build/web/index.html
          ./godot --headless --export-release "Windows" build/windows/ClumsyValor.exe
          # one-click download of the newest Windows build: on the Pages site, and as the repo's latest release
          (cd build/windows && zip -q -9 ../web/ClumsyValor-windows.zip *)
          ls -la build/web/ClumsyValor-windows.zip
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build build/web/ClumsyValor-windows.zip --target "$GITHUB_SHA" --latest \
            --title "최신 빌드 $(date -u -d '+9 hours' +%m-%d\ %H:%M) · ${GITHUB_SHA::7}" \
            --notes "main의 최신 커밋을 자동으로 빌드한 Windows 버전. 압축을 풀고 ClumsyValor.exe 실행."
      - uses: actions/upload-artifact@v4
        with:
          name: ClumsyValor-windows
          path: build/windows
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
